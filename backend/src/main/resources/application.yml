spring:
  application:
    name: backend
  config:
    # Reads MYSQL_* values from the repo-root .env (gitignored). Optional, so CI/prod can use real env vars instead.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_HOST_PORT:3307}/${MYSQL_DATABASE:taskmanagement}
    username: ${MYSQL_USER:taskapp}
    password: ${MYSQL_PASSWORD:}
    hikari:
      # Fail fast (5 s) when the database is unreachable instead of the 30 s default.
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
